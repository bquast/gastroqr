<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Maps Review QR</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <h1>Generate QR for Google Review</h1>
    <div class="search-container">
        <input type="text" id="query" placeholder="Enter business name and address (e.g., Hard Rock Cafe Zurich)" autocomplete="off">
        <ul id="suggestions" class="suggestions"></ul>
    </div>
    <div id="qrcode"></div>
    <p id="shortUrl"></p>
    <p id="error"></p>

    <script src="/qrcode.min.js"></script>
    <script>
        const input = document.getElementById('query');
        const suggestionsUl = document.getElementById('suggestions');
        const qrcodeDiv = document.getElementById('qrcode');
        const shortUrlP = document.getElementById('shortUrl');
        const errorP = document.getElementById('error');

        let timeout;
        input.addEventListener('keyup', (e) => {
            clearTimeout(timeout);
            const query = input.value.trim();
            if (query.length < 3) {
                hideSuggestions();
                return;
            }

            timeout = setTimeout(async () => {
                try {
                    const res = await fetch(`/api/autocomplete?input=${encodeURIComponent(query)}`);
                    if (!res.ok) throw new Error('Autocomplete error');

                    const { suggestions } = await res.json();
                    showSuggestions(suggestions);
                } catch (err) {
                    errorP.textContent = `Error: ${err.message}`;
                    hideSuggestions();
                }
            }, 300); // Debounce 300ms
        });

        suggestionsUl.addEventListener('click', async (e) => {
            if (e.target.tagName === 'LI') {
                const placeId = e.target.dataset.placeid;
                const fullText = e.target.textContent;
                input.value = fullText;
                hideSuggestions();
                clearOutputs();
                await generateQR(placeId);
            }
        });

        // Hide on click outside
        document.addEventListener('click', (e) => {
            if (!document.querySelector('.search-container').contains(e.target)) {
                hideSuggestions();
            }
        });

        function showSuggestions(suggestions) {
            suggestionsUl.innerHTML = '';
            if (suggestions.length === 0) {
                hideSuggestions();
                errorP.textContent = 'No suggestions found. Try refining your search.';
                return;
            }

            suggestions.forEach(sug => {
                const li = document.createElement('li');
                li.dataset.placeid = sug.placeId;
                li.textContent = `${sug.mainText} - ${sug.secondaryText}`;
                suggestionsUl.appendChild(li);
            });
            suggestionsUl.style.display = 'block';
        }

        function hideSuggestions() {
            suggestionsUl.style.display = 'none';
            suggestionsUl.innerHTML = '';
            errorP.textContent = '';
        }

        async function generateQR(placeId) {
            try {
                const genRes = await fetch(`/api/generate-review?place_id=${encodeURIComponent(placeId)}`);
                if (!genRes.ok) throw new Error('Generate error');

                const { shortUrl } = await genRes.json();
                shortUrlP.textContent = `Short URL: ${shortUrl}`;

                new QRCode(qrcodeDiv, {
                    text: shortUrl,
                    width: 256,
                    height: 256,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            } catch (err) {
                errorP.textContent = `Error: ${err.message}`;
            }
        }

        function clearOutputs() {
            qrcodeDiv.innerHTML = '';
            shortUrlP.textContent = '';
            errorP.textContent = '';
        }
    </script>
</body>
</html>
